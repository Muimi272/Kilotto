name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example, v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js for frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend tests
        run: node --test src/test/js/opening.test.cjs

      - name: Test and package executable JAR
        # The wrapper is tracked without the executable bit, so invoke it with bash.
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Generate JAR checksums
        working-directory: target
        # Spring Boot's original archive ends in .jar.original and is excluded.
        run: sha256sum -- *.jar > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            target/*.jar
            target/SHA256SUMS
