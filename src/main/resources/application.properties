spring.application.name=kilotto
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=${KILOTTO_DATABASE_URL:jdbc:sqlite:kilotto.db?busy_timeout=5000&foreign_keys=on}
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=KILOTTO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${KILOTTO_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
spring.web.error.include-message=never

kilotto.bootstrap.username=${KILOTTO_ADMIN_USERNAME:}
kilotto.bootstrap.password=${KILOTTO_ADMIN_PASSWORD:}
kilotto.websocket.allowed-origin-patterns=${KILOTTO_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:}
