# Override storage and test credentials while inheriting the production security settings.
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
server.servlet.session.cookie.name=KILOTTO_SESSION
server.servlet.session.cookie.secure=false
kilotto.bootstrap.username=test-admin
kilotto.bootstrap.password=test-admin-password-2026
kilotto.limits.logins-per-minute=10000
kilotto.limits.upgrades-per-minute=10000
